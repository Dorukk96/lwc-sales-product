<template>
    <section class="card slds-var-p-around_medium">

      <div>
        <div class="slds-grid slds-grid_align-end slds-var-m-around_small slds-is-relative aggregated-result"> {grantTotal} </div>
      </div>
      <template lwc:if={products}>
        <lightning-datatable
          key-field="id"
          data={products}
          columns={cols}
          max-row-selection="1"
          onrowselection={displayModalHandler}>
        </lightning-datatable>
      </template>

      <template lwc:else>⚠️ No product found.</template>
    </section>

    <template lwc:if={isModalActive}>
      <c-modal-component onhide={closeModal}>
        <div slot="header">{selectedLineItem.Name}</div>
        <div slot="body">
          Name: {selectedLineItem.Name} <br>
          Unit Price: {selectedLineItem.UnitPrice} <br>
          Quantity : {selectedLineItem.Quantity} <br>
          Total Price: {selectedLineItem.TotalPrice}
        </div>
        <div slot="footer">
          <button 
            class="slds-button slds-button_destructive" 
            aria-label="Cancel and close"
            onclick={closeModal}>
              Close
          </button>
        </div>
      </c-modal-component>
    </template>

    <div>New Feature branch has been added</div>
    <hr>
</template>
